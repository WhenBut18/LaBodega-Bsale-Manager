name: Deploy Website

on:
  push:
    branches:
      - main # Se ejecutará solo cuando subas cambios a la rama main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # Si usas Composer, aquí se hace el "Build"
      - name: 🔨 Install Dependencies (PHP/Composer)
        run: composer install --no-dev --optimize-autoloader

      # Aquí puedes agregar pasos de Node/NPM si compilas assets (Vite, Tailwind, etc.)
      # - name: Install NPM dependencies
      #   run: npm install && npm run build

      - name: 📂 Sync files to Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/ # La ruta en tu cPanel donde va la web
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**